function newRunId(){if(typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function')return crypto.randomUUID();return 'aq'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,14)}

if(!state.runId)state.runId=newRunId();

function hhmm(ms){let secs=Math.max(0,Math.floor(ms/1000));return `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`}

function savedResultsQueue(){

  catch(e){return []}
}
function writeResultsQueue(queue){

}
function syncHint(){

}
function showSyncState(){const box=document.getElementById('syncState');if(box)box.textContent=syncHint()}
function recordLevelResult(index){
  if(index<0||index>=MAX||!state.done[index]||!state.surname||!state.givenName)return;
  if(!state.runId)state.runId=newRunId();
  const eventId=state.runId+':'+(index+1);
  const queue=savedResultsQueue();
  if(!queue.some(x=>x.eventId===eventId)){
    queue.push({
      schema:RESULTS_SCHEMA,eventId,runId:state.runId,runNumber:state.runNumber||1,
      className:'10-Б',surname:state.surname,givenName:state.givenName,
      level:index+1,title:titles[index],levelXp:state.scores[index],totalXp:xp(),
      levelChecks:state.verifications[index],totalChecks:state.verifications.reduce((a,b)=>a+b,0),
      hintUsed:!!state.hints[index],totalHints:state.hints.filter(Boolean).length,
      elapsedSec:Math.floor(elapsed()/1000)
    });
    writeResultsQueue(queue);
  }
  persist();
  void syncQueuedResults();
}
function confirmResultReceipt(eventId){
  return new Promise(resolve=>{
    if(!RESULTS_WEB_APP_URL)return resolve(false);
    const callback='__aqReceipt_'+Math.random().toString(36).slice(2,14);
    const script=document.createElement('script');
    let timeout,finished=false;
    const done=ok=>{
      if(finished)return;
      finished=true;clearTimeout(timeout);delete window[callback];script.remove();resolve(ok);
    };
    window[callback]=(data)=>done(!!data&&data.id===eventId&&data.stored===true);
    script.onerror=()=>done(false);
    timeout=setTimeout(()=>done(false),9000);
    script.src=RESULTS_WEB_APP_URL+'?check='+encodeURIComponent(eventId)+'&cb='+encodeURIComponent(callback)+'&_t='+Date.now();
    document.head.appendChild(script);
  });
}
let syncingResults=false;
async function syncQueuedResults(){
  if(syncingResults||!RESULTS_WEB_APP_URL||typeof fetch!=='function'||(typeof navigator!=='undefined'&&navigator.onLine===false))return;
  syncingResults=true;
  try{
    for(const item of savedResultsQueue()){
      let ok=false;
      try{
        const before=await confirmResultReceipt(item.eventId);
        if(before)ok=true;
        else{
          await fetch(RESULTS_WEB_APP_URL,{
            method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},
            body:JSON.stringify(item),keepalive:true
          });
          ok=await confirmResultReceipt(item.eventId);
        }
      }catch(e){ok=false}
      if(ok){writeResultsQueue(savedResultsQueue().filter(x=>x.eventId!==item.eventId))}
      else break; // наступна спроба — при поверненні інтернету або пізніше
    }
  }finally{syncingResults=false;showSyncState()}
}

function rank(){if(xp()===MAX*100)return ['👑','ЛЕГЕНДА БЕЗ ПІДКАЗОК','Бот-скептик офіційно втратив віру у власні прогнози.'];if(xp()>=950)return ['🏆','АЛГОРИТМІЧНИЙ БОС','Бот недооцінив тебе. Хоча це було неважко.'];if(xp()>=750)return ['🔥','НЕЗЛАМНИЙ ДЕБАГЕР','З помилками, зате до фіналу. Оце характер!'];return ['🛠️','МИСЛИВЕЦЬ ЗА БАГАМИ','Ти пройшов усі місії. Коли інші шукали відмазки — ти шукав алгоритми.']}

function teacherPreview(i){

    state={...base(),screen:'quest',level:i,finalPhase:i===MAX-1?teacher.bossPhase:0};

function render(){showSyncState();document.body.classList.toggle('teacher-view',!!teacher.screen);document.getElementById('xp').textContent=xp();document.getElementById('streak').textContent=state.streak;document.getElementById('clock').textContent=hhmm(elapsed());let app=document.getElementById('app');app.innerHTML=teacher.screen==='login'?viewTeacherLogin():teacher.screen==='teacher'?viewTeacher():state.screen==='welcome'?viewWelcome():state.screen==='map'?viewMap():state.screen==='finish'?viewFinish():viewQuest();document.title=teacher.screen?'Вчитель · АлгоЧелендж 10-Б':(state.screen==='quest'?titles[state.level]+' · ':'')+'10-Б vs Ледар.exe';}
function openLevel(i){let available=state.done.findIndex(x=>!x);if(available<0)available=MAX; if(i>available)return;state.level=i;state.screen='quest';state.selection=null;state.message=null;persist();render();window.scrollTo({top:0,behavior:'smooth'});}
function award(){let i=state.level;if(state.done[i])return;state.done[i]=true;let points=potential(i);state.scores[i]=points;if(state.attempts[i]===0&&!state.hints[i])state.streak++;else state.streak=0;state.bestStreak=Math.max(state.bestStreak,state.streak);state.message={type:'good',title:`🎯 ЗАРАХОВАНО! +${points} XP`,text:`${keys[i]} Перевірок: ${state.verifications[i]}; підказка: ${state.hints[i]?'так':'ні'}.`};state.selection=null;persist();render();}
function fail(){let i=state.level;state.attempts[i]++;state.streak=0;state.message={type:'bad',title:`⚠️ Перевірка №${state.verifications[i]}: −20 XP`,text:`${failMessages[i]} Наступна правильна перевірка дасть ${potential(i)} XP.`};persist();render();}
function check(){let i=state.level;if(state.done[i])return;const assembly=i===1||(i>=5&&i<=9);if(!assembly&&state.selection===null)return;state.verifications[i]++;let right=false;
if(i===0)right=state.selection===0;
if(i===1)right=state.order.every((v,j)=>v===j);

if(i===4)right=state.selection===0;
if(i===10){if(state.finalPhase===0&&state.selection===0){state.finalPhase=1;state.selection=null;state.message={type:'good',title:'✅ ПЕРШИЙ УДАР ПО БОТУ · перевірка −20 XP',text:'Перший етап правильний. Дві обов’язкові перевірки фінального боса входять у максимальні 100 XP. Залишилося назвати маршрут.'};persist();render();return;}right=state.finalPhase===1&&state.selection===3;}
if(i>=5&&i<=9)right=state.orders[i-5].every((v,j)=>v===j);right?award():fail();}
function hint(){let i=state.level;if(state.done[i])return;let first=!state.hints[i];state.hints[i]=true;state.message={type:'good',title:first?'💡 Підказка: −20 XP':'💡 Повтор підказки: без нового штрафу',text:hintMessages[i]};persist();render();}
function reset(){if(!confirm('Почати новий забіг? Поточні XP та місії будуть скинуті.'))return;pause();let nextRun=(state.runNumber||1)+1;state=base();state.runNumber=nextRun;persist();render();window.scrollTo({top:0,behavior:'smooth'})}
function next(){if(!state.done[state.level])return;recordLevelResult(state.level);if(state.level===MAX-1){pause();state.screen='finish';persist();render()}else openLevel(state.level+1);window.scrollTo({top:0,behavior:'smooth'})}
async function share(){let text=`🏆 10-Б vs Ледар.exe\nІм’я та прізвище: ${fullName()}\nМісії: 11/11\nXP: ${xp()}/1100\nОцінка: ${grade()}/12\nПеревірок: ${state.verifications.reduce((a,b)=>a+b,0)}\nЗабіг: ${state.runNumber||1}\nЧас: ${hhmm(elapsed())}\nКомбо: x${state.bestStreak}\n#АлгоЧелендж`;let status=document.getElementById('sharestatus');try{if(navigator.share){await navigator.share({title:'АлгоЧелендж 10-Б',text})}else if(navigator.clipboard){await navigator.clipboard.writeText(text);if(status)status.textContent='✅ Скопійовано. Можна надіслати вчителю.'}else if(status){status.textContent='Зроби скриншот цього екрана.'}}catch(e){if(e.name!=='AbortError'&&status)status.textContent='Зроби скриншот цього екрана.'}}
document.addEventListener('click',e=>{const el=e.target.closest('button[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;switch(action){case 'teacherLogin':teacher.screen='login';teacher.error='';render();break;case 'teacherExit':teacher.screen=null;teacher.error='';teacher.showAnswer=false;render();window.scrollTo({top:0,behavior:'smooth'});break;case 'teacherSelect':teacherPick(Number(el.dataset.value));break;case 'teacherPrev':teacherPick(teacher.level-1);break;case 'teacherNext':teacherPick(teacher.level+1);break;case 'teacherAnswer':if(teacher.screen==='teacher'){teacher.showAnswer=!teacher.showAnswer;render()}break;case 'teacherPhase':if(teacher.screen==='teacher'&&teacher.level===MAX-1){teacher.bossPhase=Number(el.dataset.value)===1?1:0;teacher.showAnswer=false;render()}break;case 'start':{const surnameInput=document.getElementById('surname'),givenInput=document.getElementById('givenName');const s=(surnameInput?.value||'').trim().slice(0,45),g=(givenInput?.value||'').trim().slice(0,45);if(!s||!g){const target=!s?surnameInput:givenInput;target.setCustomValidity('Заповни це поле');target.reportValidity();target.addEventListener('input',()=>target.setCustomValidity(''),{once:true});return;}state.surname=s;state.givenName=g;state.screen='map';state.started=true;resume();persist();render();break;}case 'go':openLevel(Number(el.dataset.value));break;case 'map':state.screen='map';state.message=null;persist();render();window.scrollTo({top:0,behavior:'smooth'});break;case 'pick':state.selection=Number(el.dataset.value);state.message=null;persist();render();break;case 'check':check();break;case 'hint':hint();break;case 'move':{let p=Number(el.dataset.pos),to=p+Number(el.dataset.dir),arr=state.level===1?state.order:state.orders[state.level-5];if(arr&&to>=0&&to<arr.length){[arr[p],arr[to]]=[arr[to],arr[p]];state.message=null;persist();render()}break;}case 'setn':state.n=Number(el.dataset.value);persist();render();break;case 'next':next();break;case 'finish':if(state.done[MAX-1])recordLevelResult(MAX-1);pause();state.screen='finish';persist();render();break;case 'restart':reset();break;case 'share':share();break;}});
document.addEventListener('submit',e=>{if(e.target&&e.target.id==='teacherForm'){e.preventDefault();teacherEnter()}});
window.addEventListener('online',()=>void syncQueuedResults());
setInterval(()=>{if(state.started&&state.screen!=='finish'&&!teacher.screen)document.getElementById('clock').textContent=hhmm(elapsed())},500);
setInterval(()=>void syncQueuedResults(),90000);
render();
void syncQueuedResults();
</script>
</body>
