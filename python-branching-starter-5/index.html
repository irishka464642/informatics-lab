<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1021">
<meta name="description" content="Академія рішень — проста навчальна гра на 5 рівнів про розгалуження if/else у Python для 7 класу.">
<title>Академія рішень — 5 місій із розгалуженнями</title>
<style>
:root{color-scheme:dark;--bg:#090f20;--ink:#f5f8ff;--muted:#aab9d0;--line:#35445f;--card:#141f36;--accent:#ffd477;--mint:#84f5ce;--blue:#94c8ff;--red:#ffaaa6}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 2%,#183a62 0,transparent 36%),radial-gradient(circle at 93% 17%,#3d2553 0,transparent 33%),#090f20;line-height:1.5}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed}
.shell{max-width:1100px;margin:auto;padding:20px 20px 50px}
.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#5b66d4,#1db6a6);box-shadow:0 0 32px #2b9ed344;font-size:26px}
.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:900;color:var(--mint)}
.brand-name{font-size:22px;font-weight:900;letter-spacing:-.04em}
.help-top{color:var(--muted);font-size:13px}
.navbtn{color:var(--ink);background:#1c2c47;border:1px solid #4b6687;border-radius:12px;padding:9px 12px;font-size:13px}
.hero{margin-top:22px;border:1px solid #56678b88;border-radius:24px;overflow:hidden;background:linear-gradient(105deg,#172b4b 0%,#1b1e3c 60%,#182544 100%);box-shadow:0 20px 68px #0005}
.hero-inside{padding:28px 32px 23px;position:relative}
.hero-inside:after{content:"";position:absolute;right:-24px;top:-78px;width:235px;height:235px;border:2px solid #e7e4ff14;border-radius:50%;box-shadow:0 0 0 30px #e7e4ff06,0 0 0 75px #e7e4ff06;pointer-events:none}
.hero h1{font-size:clamp(27px,4.5vw,43px);line-height:1.12;margin:5px 0 10px;letter-spacing:-.055em;max-width:670px}
.hero p{color:#d2dbeb;max-width:710px;margin:0;font-size:16px}
.progress{display:flex;gap:8px;margin-top:22px}
.pip{flex:1;min-width:0;padding:9px 6px;border-radius:12px;background:#ffffff0b;border:1px solid #ffffff24;text-align:center;font-weight:800;color:#afbed3;font-size:12px}
.pip.done{background:#17574d;border-color:#4ec5a6;color:#e7fff9}.pip.active{background:#5c4e29;border-color:#ffd477;color:#fff5d6;box-shadow:0 0 24px #e8bc6544}
.cols{display:grid;grid-template-columns:minmax(0,1.13fr) minmax(300px,.87fr);gap:20px;margin-top:20px}
.panel{border:1px solid #374b68;border-radius:22px;background:linear-gradient(160deg,#16233b,#111b2f);box-shadow:0 12px 40px #0003;overflow:hidden}
.panel-content{padding:25px}
.kicker{color:var(--accent);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:900}
h2{font-size:clamp(24px,3.2vw,31px);letter-spacing:-.045em;margin:7px 0 10px;line-height:1.14}
.lead{color:#e0e9f6;font-size:16px;line-height:1.55;margin:0 0 18px}
.story{background:#26354e;border-left:4px solid var(--mint);border-radius:9px;padding:13px 14px;color:#e5f8f7;margin-bottom:17px}
.story strong{color:var(--mint)}
.lesson{border:1px solid #4e6687;border-radius:14px;background:#0f1a2e;padding:15px 17px;margin:17px 0}
.lesson h3{margin:0 0 7px;font-size:15px;color:var(--accent)}
.lesson p{margin:0;font-size:15px;color:#dbe7fb}
.glyph{background:#0006;padding:1px 6px;border-radius:6px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--mint)}
.question{font-weight:850;font-size:20px;line-height:1.3;margin:18px 0 14px}
.choices{display:grid;gap:10px}
.choice{width:100%;border:2px solid #526583;background:#22334f;color:var(--ink);text-align:left;padding:15px 17px;border-radius:13px;font-weight:750;font-size:16px;transition:transform .14s,background .14s,border-color .14s}
.choice:hover{transform:translateY(-2px);background:#314766;border-color:#bad7fb}
.choice:disabled{transform:none}
.action{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:12px;padding:13px 18px;border:0;background:linear-gradient(110deg,#f5bd62,#ffe096);color:#1b1b30;font-weight:900;min-height:48px}
.action.secondary{background:#273a56;border:1px solid #607695;color:#f6f9ff}
.action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}
.feedback{padding:14px 16px;border-radius:13px;margin-top:16px;border:1px solid #567398;background:#22334f;font-size:15px}
.feedback.ok{border-color:#48c8a2;background:#154e47;color:#e2fff4}
.feedback.bad{border-color:#e59b9b;background:#4b2835;color:#fff0ee}
.feedback p{margin:4px 0 0}
.small{color:var(--muted);font-size:13px}
.visual{min-height:285px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px 21px;background:radial-gradient(circle at center 25%,#35577c 0%,#17233c 50%,#111b2f 85%);position:relative;isolation:isolate}
.visual:before{content:"";position:absolute;inset:15px;background:linear-gradient(transparent 95%,#7292ae1c 96%) 0 0/100% 25px,linear-gradient(90deg,transparent 95%,#7292ae1c 96%) 0 0/25px 100%;opacity:.45;border-radius:18px;z-index:-1}
.visual .emoji{font-size:clamp(74px,10vw,114px);line-height:1.15;filter:drop-shadow(0 22px 24px #0007);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-9px)}}
.visual .scene-title{font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:#ffdb92;text-align:center;margin-top:16px;font-size:13px}
.visual .big-value{font-size:25px;font-weight:950;margin:8px 0}
.scene-meter{width:80%;max-width:280px;background:#0008;border:1px solid #7490b1;border-radius:100px;height:16px;overflow:hidden;margin-top:7px}
.scene-meter span{display:block;height:100%;background:linear-gradient(90deg,#f6c96b,#72efbd);border-radius:100px;transition:width .25s}
.scene-caption{font-size:13px;color:#b8d0ec;text-align:center;margin:10px 0 0}
.diagram{width:100%;max-width:360px;margin:auto}
.question-node{text-align:center;padding:15px;border:2px solid #eabf74;border-radius:16px;background:#453b35;color:#fff5dc;font-weight:850}
.fork{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:38px}
.fork div{padding:16px 10px;border:1px solid #4c8cb7;border-radius:12px;text-align:center;background:#173249;position:relative;font-weight:800}
.fork div:before{content:"";position:absolute;width:1px;height:32px;background:#94c8ff;left:50%;top:-35px}
.fork strong{display:block;color:#b9ddff;font-size:13px}
.code{border:1px solid #465b75;border-radius:14px;background:#080f1c;overflow:hidden;margin:14px 0}
.code-header{background:#192d44;color:#c2d6ee;padding:9px 13px;font-size:12px;letter-spacing:.07em;font-weight:800}
pre{margin:0;white-space:pre-wrap;word-wrap:break-word;padding:15px;color:#e5efff;font:15px/1.95 ui-monospace,Consolas,"Liberation Mono",monospace}
.kw{color:#ffca80;font-weight:bold}.str{color:#9af6cf}.num{color:#b9d0ff}
.slot{display:inline-block;background:#293e5c;border:1px dashed #ffe099;color:#ffe099;border-radius:5px;padding:0 6px;min-width:35px;min-height:28px;font:inherit;vertical-align:middle}
.slot.filled{border-style:solid;background:#4b392b}
.token-grid{display:flex;gap:8px;flex-wrap:wrap}
.token{border:1px solid #82a5d2;background:#2b4160;border-radius:10px;padding:9px 12px;color:#fff;font:800 15px ui-monospace,Consolas,monospace;max-width:100%;white-space:normal;text-align:left}
.token:hover{background:#405f88}
.code-line{padding:8px 12px;border:1px solid #607491;border-radius:9px;background:#1d304c;color:#d7e8ff;font:14px/1.4 ui-monospace,Consolas,monospace}
.code-line.next{border-style:dashed;color:#b4c2d6}
.badge{display:inline-block;border-radius:100px;background:#3e3454;color:#efd6ff;border:1px solid #8865b7;font-size:12px;padding:5px 10px;font-weight:750}
.hint{margin-top:15px}
.hint button{border:1px solid #52617d;border-radius:10px;padding:8px 12px;background:#253752;color:#d8e8ff}
.hint p{margin:10px 0 0;padding:11px 13px;border-radius:10px;background:#213651;border-left:3px solid var(--accent);font-size:14px}
.footer{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap;color:#99b2ce;font-size:12px}
.conclusion{border:1px solid #4ec5a6;border-radius:17px;background:#143e3b;padding:20px;margin-top:13px}
.conclusion h3{color:var(--mint);font-size:20px;margin:0 0 10px}
.conclusion p{margin:8px 0}
.choices-mini{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.choice-mini{background:#283e5b;border:1px solid #819bb8;border-radius:12px;padding:12px 14px;color:white;font-weight:750}
.codehint{color:#c3d5ed;font-size:13px;margin-top:7px}
.checkpoint{border:1px solid #5c7594;border-radius:12px;padding:12px;background:#192d46;margin:10px 0}
@media(max-width:820px){.cols{grid-template-columns:1fr}.visual{min-height:205px}.visual .emoji{font-size:76px}.hero-inside{padding:23px}.panel-content{padding:22px}.progress{gap:5px}.pip{font-size:11px}}
@media(max-width:420px){.shell{padding:13px 12px 40px}.brand-name{font-size:18px}.hero h1{font-size:29px}.pip{padding:9px 2px}.token{font-size:13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<header class="top">
  <div class="brand"><div class="logo" aria-hidden="true">🧭</div><div><div class="eyebrow">Інформатика • 7 клас</div><div class="brand-name">Академія рішень</div></div></div>
  <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap"><span class="help-top">5 коротких рівнів · без поспіху</span><button id="restart" class="navbtn" type="button">↻ Почати спочатку</button></div>
</header>
<section class="hero" aria-label="Прогрес навчання">
  <div class="hero-inside">
    <div class="eyebrow" id="episode">ПЕРШИЙ КРОК У PYTHON</div>
    <h1 id="heroTitle">Рішення починається з питання</h1>
    <p id="heroSummary">Одна умова — два можливі шляхи. Ти навчишся керувати ними крок за кроком.</p>
    <div class="progress" id="progress" aria-label="П'ять рівнів"></div>
  </div>
</section>
<main id="app" aria-live="polite"></main>
<div class="footer"><span>💾 Прогрес автоматично зберігається в цьому браузері.</span><span>Без реєстрації та введення персональних даних.</span></div>
</div>
<script>
(function(){
"use strict";
var STORAGE_KEY="decision-academy-5-v1";
var LESSONS=[
 {title:"Умова — це запитання",sub:"Починаємо без коду: вчимось обирати «так» або «ні».",caption:"КРОК 1 · ТАК ЧИ НІ"},
 {title:"Два шляхи: if і else",sub:"Якщо умова істинна — перша дія. Інакше — друга.",caption:"КРОК 2 · ВИБІР ШЛЯХУ"},
 {title:"Читаємо перший код Python",sub:"Знайди дві команди, які керують вибором.",caption:"КРОК 3 · СЛОВА МОВИ PYTHON"},
 {title:"Перевіряємо межу",sub:"Чому 10 — це не те саме, що 9? Досліди три числа.",caption:"КРОК 4 · ТЕСТУВАННЯ"},
 {title:"Збери власне розгалуження",sub:"Склади чотири рядки й запусти програму двічі.",caption:"КРОК 5 · МІНІПРОЄКТ"}
];
function fresh(){return {level:0,step:0,passed:false,slots:["",""],lines:[],assembled:false,tests:[],hint:false,notice:"",noticeKind:""};}
function load(){
 try{
  var v=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
  if(v&&Number.isInteger(v.level)&&v.level>=0&&v.level<=5&&Number.isInteger(v.step)&&v.step>=0&&v.step<=3&&Array.isArray(v.slots)&&Array.isArray(v.lines)&&Array.isArray(v.tests)){
   return Object.assign(fresh(),v);
  }
 }catch(e){}
 return fresh();
}
var state=load();
var app=document.getElementById("app");
function store(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}
function safe(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function finishPart(){state.passed=true;state.hint=false;state.notice="";state.noticeKind="";store();render();}
function fail(msg){state.notice=msg;state.noticeKind="bad";store();render();}
function next(){
 if(!state.passed)return;
 if((state.level===0||state.level===1||state.level===3) && state.step < (state.level===3?2:1)){
  state.step++;state.passed=false;
 }else{
  state.level=Math.min(5,state.level+1);state.step=0;state.passed=false;state.slots=["",""];state.lines=[];state.assembled=false;state.tests=[];
 }
 state.notice="";state.noticeKind="";state.hint=false;store();render();
 window.scrollTo({top:0,behavior:"smooth"});
}
function noticeHTML(){
 if(!state.notice)return "";
 return '<div class="feedback '+safe(state.noticeKind)+'" role="status">'+safe(state.notice)+'</div>';
}
function hintHTML(str){
 return '<div class="hint"><button type="button" data-action="hint">'+(state.hint?'Сховати підказку':'💡 Потрібна підказка?')+'</button>'+(state.hint?'<p>'+str+'</p>':"")+'</div>';
}
function continueHTML(){
 return state.passed?'<div class="action-row"><button class="action" data-action="next">'+(state.level===4?'🏆 Завершити навчання':state.level===3&&state.step===2?'До фінального завдання →':'Продовжити →')+'</button></div>':"";
}
function scene(emoji,name,value,caption,pct){
 return '<div class="visual"><div class="emoji" aria-hidden="true">'+emoji+'</div><div class="scene-title">'+name+'</div><div class="big-value">'+value+'</div>'+(pct===null?'':'<div class="scene-meter"><span style="width:'+pct+'%"></span></div>')+'<p class="scene-caption">'+caption+'</p></div>';
}
function simpleLevel(){
 var l=state.level,s=state.step;
 if(l===0){
  var coins=[20,35][s],ok=coins>=30;
  return {
   left:'<div class="story">🛒 У магазині меч коштує <strong>30 монет</strong>. Гравець хоче його придбати.</div>'+
    '<div class="lesson"><h3>Що таке умова?</h3><p><strong>Умова</strong> — запитання, на яке можна відповісти <strong>ТАК</strong> або <strong>НІ</strong>. Наприклад: «Чи вистачає монет?»</p></div>'+
    '<div class="question">У гравця '+coins+' монет. Чи може він купити меч?</div>',
   choices:[["yes","✅ Так, вистачає монет"],["no","❌ Ні, монет замало"]],
   right:scene("⚔️","МАГАЗИН ГЕРОЯ","🪙 "+coins+" / 30","Думай про умову, а не вгадуй.",Math.min(100,coins/30*100)),
   expected:ok?"yes":"no",
   explanation:ok?"35 ≥ 30. Монет достатньо, тому покупка дозволена.":"20 < 30. Монет недостатньо, тому покупка неможлива.",
   hint:"Порівняй число монет із ціною 30. Купити можна, коли монет не менше ніж 30."
  };
 }
 if(l===1){
  var key=[1,0][s],opened=key===1;
  return {
   left:'<div class="story">🚪 Перед героєм ворота. Якщо ключ є — ворота відкриються. Інакше залишаться зачиненими.</div>'+
    '<div class="lesson"><h3>Запам’ятай два слова</h3><p><span class="glyph">if</span> — <strong>якщо</strong> умова правильна.<br><span class="glyph">else</span> — <strong>інакше</strong>, якщо умова неправильна.</p></div>'+
    '<div class="question">Ключ = '+key+'. Який шлях обере програма?</div>',
   choices:[["open","🔓 Відкрити ворота (if)"],["closed","🔒 Не відкривати (else)"]],
   right:'<div class="visual"><div class="diagram"><div class="question-node">if key == 1</div><div class="fork"><div><strong>ТАК → if</strong>🔓 Відкрити</div><div><strong>НІ → else</strong>🔒 Зачинено</div></div></div><p class="scene-caption">Знак == означає «дорівнює?», а не присвоєння.</p></div>',
   expected:opened?"open":"closed",
   explanation:opened?"Ключ = 1, отже перевірка key == 1 істинна. Виконується гілка if.":"Ключ = 0, тому key == 1 — хибна умова. Виконується гілка else.",
   hint:"Спочатку запитай себе: «Чи дорівнює ключ одиниці?». Якщо так — if; якщо ні — else."
  };
 }
 var power=[9,10,11][s],on=power>=10;
 return {
  left:'<div class="story">⚡ Енергокупол активується, якщо енергії <strong>10 або більше</strong>.</div>'+
   '<div class="lesson"><h3>Що означає знак ≥?</h3><p><span class="glyph">&gt;=</span> означає <strong>більше АБО дорівнює</strong>. Число 10 теж підходить!</p></div>'+
   '<div class="code"><div class="code-header">PYTHON · ЧИТАЄМО УМОВУ</div><pre><span class="kw">if</span> power &gt;= <span class="num">10</span>:\n    print(<span class="str">"Купол працює"</span>)\n<span class="kw">else</span>:\n    print(<span class="str">"Мало енергії"</span>)</pre></div>'+
   '<div class="question">Енергія = '+power+'. Який результат?</div>',
  choices:[["on","🛡️ Купол працює"],["off","🪫 Мало енергії"]],
  right:scene("🛡️","ЕНЕРГОКУПОЛ","⚡ "+power+" / 10","Перевір нижче, дорівнює чи вище за поріг.",Math.min(100,power/11*100)),
  expected:on?"on":"off",
  explanation:on?"Умова power >= 10 істинна. "+power+" — достатньо для запуску.":"9 < 10, тому умова хибна. Купол не вмикається.",
  hint:"Число 10 підходить! Запис >= означає «більше або дорівнює»."
 };
}
function renderSimple(){
 var d=simpleLevel(), buttons=d.choices.map(function(c){
  return '<button type="button" class="choice" data-action="choice" data-value="'+c[0]+'"'+(state.passed?' disabled':'')+'>'+c[1]+'</button>';
 }).join("");
 var affirm=state.passed?'<div class="feedback ok"><strong>🎉 Саме так!</strong><p>'+d.explanation+'</p></div>':noticeHTML();
 return '<div class="cols"><section class="panel"><div class="panel-content"><div class="kicker">СПРОБУЙ · СИТУАЦІЯ '+(state.step+1)+' ІЗ '+(state.level===3?3:2)+'</div><h2>'+safe(LESSONS[state.level].title)+'</h2><p class="lead">'+safe(LESSONS[state.level].sub)+'</p>'+d.left+'<div class="choices">'+buttons+'</div>'+affirm+continueHTML()+hintHTML(d.hint)+'</div></section><aside class="panel">'+d.right+'<div class="panel-content small">Навіть якщо з першого разу не вийшло, можна спробувати ще раз. Тут немає штрафних балів.</div></aside></div>';
}
function renderCodeLesson(){
 var slots=state.slots;
 var a='<button type="button" class="slot '+(slots[0]?'filled':'')+'" data-action="clear-slot" data-index="0" title="Натисни, щоб змінити">'+safe(slots[0]||" ? ")+'</button>';
 var b='<button type="button" class="slot '+(slots[1]?'filled':'')+'" data-action="clear-slot" data-index="1" title="Натисни, щоб змінити">'+safe(slots[1]||" ? ")+'</button>';
 return '<div class="cols"><section class="panel"><div class="panel-content">'+
 '<div class="kicker">ЗБИРАЄМО КОД ІЗ ДВОХ СЛІВ</div><h2>Читаємо Python</h2><p class="lead">Тут у нас вже готова програма. Треба вставити тільки два слова: <strong>якщо</strong> та <strong>інакше</strong>.</p>'+
 '<div class="lesson"><h3>Три важливі деталі</h3><p><span class="glyph">if</span> — якщо; <span class="glyph">else</span> — інакше.<br><span class="glyph">:</span> — далі йде дія.<br><strong>4 пробіли</strong> — показують, що дія належить до умови.</p></div>'+
 '<div class="code"><div class="code-header">PYTHON · ВСТАВ ПРОПУЩЕНІ СЛОВА</div><pre>key = <span class="num">1</span>\n'+a+' key == <span class="num">1</span>:\n    print(<span class="str">"Двері відкрито"</span>)\n'+b+':\n    print(<span class="str">"Потрібен ключ"</span>)</pre></div>'+
 '<div class="question">Натискай на слова в потрібному порядку:</div>'+
 '<div class="token-grid"><button class="token" data-action="slot" data-value="if">if</button><button class="token" data-action="slot" data-value="else">else</button><button class="token" data-action="slot" data-value="print">print</button></div>'+
 '<p class="codehint">Щоб замінити слово, натисни на його місце у коді.</p>'+
 (state.passed?'<div class="feedback ok"><strong>✅ Код правильний!</strong><p>if перевіряє умову; else виконується, коли вона хибна. Відступи виділяють команди всередині гілок.</p></div>':noticeHTML())+
 '<div class="action-row">'+(!state.passed?'<button class="action" data-action="check-slots">Перевірити код</button>':'')+(state.passed?continueHTML():'')+'</div>'+
 hintHTML('На першому місці має бути «якщо», на другому — «інакше».')+
 '</div></section><aside class="panel">'+scene("🧩","СЛОВА-КОМАНДИ","if  →  else","Обирай лише два слова. Сам текст програми вже готовий.",null)+
 '<div class="panel-content"><div class="checkpoint"><strong>Це НЕ диктант із Python.</strong><br>Ти тільки вчишся читати структуру умов.</div></div></aside></div>';
}
var correctLines=[
 'if hp > 0:',
 '    print("Робот рухається")',
 'else:',
 '    print("Робот зупинився")'
];
var lineOptions=[
 {id:"a",text:'if hp > 0:'},
 {id:"b",text:'    print("Робот рухається")'},
 {id:"c",text:'else:'},
 {id:"d",text:'    print("Робот зупинився")'},
 {id:"e",text:'if hp < 0:'},
 {id:"f",text:'    print("Робот рухається"):'}
];
function renderBuilder(){
 var source=state.lines.length?state.lines.map(function(id,i){
  return '<div class="code-line">'+(i+1)+'. '+safe(lineOptions.find(function(x){return x.id===id;}).text)+'</div>';
 }).join(""):'<div class="code-line next">Натисни на рядок унизу, щоб додати його сюди…</div>';
 var options=lineOptions.map(function(x){
  return '<button type="button" class="token" data-action="add-line" data-value="'+x.id+'"'+(state.assembled||state.lines.includes(x.id)?' disabled':'')+'>'+safe(x.text)+'</button>';
 }).join("");
 var status="";
 if(state.assembled){
  var tested=state.tests;
  status='<div class="feedback ok"><strong>✅ Правильне розгалуження!</strong><p>Тепер перевір обидва можливі варіанти виконання програми.</p></div>'+
   '<div class="lesson"><h3>Запусти з двома значеннями</h3><p><span class="glyph">hp = 1</span> — робот має енергію, виконується if.<br><span class="glyph">hp = 0</span> — енергії немає, виконується else.</p>'+
   '<div class="choices-mini"><button class="choice-mini" data-action="run" data-value="1"'+(tested.includes(1)?' disabled':'')+'>▶ Запустити: hp = 1 '+(tested.includes(1)?"✓":"")+'</button><button class="choice-mini" data-action="run" data-value="0"'+(tested.includes(0)?' disabled':'')+'>▶ Запустити: hp = 0 '+(tested.includes(0)?"✓":"")+'</button></div>'+
   (tested.length?'<div class="feedback ok">Перевірено: '+tested.map(function(n){return 'hp = '+n+' → '+(n?'Робот рухається':'Робот зупинився');}).join('; ')+'</div>':'')+
   '</div>';
 }else status=noticeHTML()+'<div class="action-row"><button class="action" data-action="check-lines"'+(state.lines.length!==4?' disabled':'')+'>Перевірити 4 рядки</button><button class="action secondary" data-action="undo"'+(!state.lines.length?' disabled':'')+'>↶ Прибрати останній</button><button class="action secondary" data-action="clear-lines">Очистити</button></div>';
 return '<div class="cols"><section class="panel"><div class="panel-content"><div class="kicker">ОСТАННЯ МІСІЯ · ЧОТИРИ РЯДКИ</div><h2>Оживи робота 🤖</h2><p class="lead">Якщо в робота є енергія (<span class="glyph">hp &gt; 0</span>), він рухається. Інакше — зупиняється.</p>'+
 '<div class="lesson"><h3>Підказка для послідовності</h3><p>1. Умова <span class="glyph">if</span>.<br>2. Дія з відступом.<br>3. <span class="glyph">else</span>.<br>4. Друга дія з відступом.</p></div>'+
 '<div class="code"><div class="code-header">PYTHON · ТВОЯ ПРОГРАМА</div><pre>hp = <span class="num">1</span></pre><div style="padding:0 12px 12px;display:grid;gap:7px">'+source+'</div></div>'+
 '<div class="question">Обери рядки в правильному порядку:</div><div class="token-grid">'+options+'</div>'+status+
 (state.passed?'<div class="feedback ok"><strong>🏆 Готово!</strong><p>Програма перевірена за двох різних умов. Ти розумієш розгалуження!</p></div>':"")+
 continueHTML()+hintHTML('Знайди рядок if hp > 0:, потім дію print із чотирма пробілами. Після цього встав else: і другу дію з відступом.')+
 '</div></section><aside class="panel">'+scene(state.tests.includes(0)?"🛠️":"🤖","РОБОТ-ТЕСТУВАЛЬНИК",state.tests.length?"Перевірено "+state.tests.length+"/2":"Готовий до запуску","Два запуски потрібні, щоб побачити обидві гілки.",state.tests.length*50)+
 '<div class="panel-content"><div class="checkpoint"><strong>Що важливо?</strong><br>Умова може бути істинною або хибною. Код має правильно працювати в обох випадках.</div></div></aside></div>';
}
function renderFinish(){
 return '<div class="cols"><section class="panel"><div class="panel-content"><div class="kicker">ВСІ П’ЯТЬ МІСІЙ ВИКОНАНО</div><h2>🏆 Ти опанував розгалуження!</h2><p class="lead">Умова — це запитання, на яке програма відповідає «так» або «ні» та обирає відповідну дію.</p>'+
 '<div class="conclusion"><h3>Тепер ти вмієш</h3><p>✅ пояснювати, навіщо потрібне розгалуження;</p><p>✅ читати <span class="glyph">if</span> та <span class="glyph">else</span>;</p><p>✅ розуміти умови <span class="glyph">==</span> і <span class="glyph">&gt;=</span>;</p><p>✅ складати короткий код і перевіряти його на різних даних.</p></div>'+
 '<div class="action-row"><button type="button" class="action" data-action="copy">📋 Скопіювати результат</button><button type="button" class="action secondary" data-action="restart">↻ Пройти ще раз</button></div>'+
 '<div id="copyStatus" role="status"></div><p class="small">Це навчальний тренажер. Результати не надсилаються в журнал автоматично: зберігається тільки прогрес у твоєму браузері.</p></div></section>'+
 '<aside class="panel">'+scene("🌟","НАСТУПНИЙ КРОК","if · else","Коли ці дві гілки стануть зрозумілими, можна переходити до if / elif / else.",100)+'</aside></div>';
}
function render(){
 var done=Math.min(state.level,5);
 document.getElementById("heroTitle").textContent=state.level===5?"Місія виконана!":LESSONS[state.level].title;
 document.getElementById("heroSummary").textContent=state.level===5?"Тепер ти розумієш головну ідею розгалуження — і можеш пояснити її іншому.":LESSONS[state.level].sub;
 document.getElementById("episode").textContent=state.level===5?"ФІНІШ · 5 ІЗ 5":LESSONS[state.level].caption;
 document.getElementById("progress").innerHTML=[0,1,2,3,4].map(function(n){
  var cls=n<done?"done":n===state.level?"active":"";
  return '<div class="pip '+cls+'" aria-label="Рівень '+(n+1)+(n<done?': завершено':n===state.level?': зараз':'')+'">'+(n<done?'✓':n+1)+'</div>';
 }).join("");
 if(state.level===5)app.innerHTML=renderFinish();
 else if(state.level===2)app.innerHTML=renderCodeLesson();
 else if(state.level===4)app.innerHTML=renderBuilder();
 else app.innerHTML=renderSimple();
}
function handle(action,value,index){
 if(action==="restart"){if(confirm("Почати заново? Поточний прогрес у цьому браузері буде очищено.")){state=fresh();store();render();}return;}
 if(action==="hint"){state.hint=!state.hint;store();render();return;}
 if(action==="next"){next();return;}
 if(state.level===5&&action==="copy"){
  var content="Академія рішень — 5/5 рівнів. Вивчено: умова, if, else, ==, >=, перевірка обох гілок.";
  Promise.resolve(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(content):Promise.reject(Error("clipboard"))).then(function(){
   var s=document.getElementById("copyStatus");if(s)s.textContent="✅ Скопійовано!";
  }).catch(function(){var s=document.getElementById("copyStatus");if(s)s.textContent=content;});
  return;
 }
 if(state.level===0||state.level===1||state.level===3){
  if(action!=="choice"||state.passed)return;
  var d=simpleLevel();
  if(value===d.expected)finishPart();
  else fail(state.level===3?"Поглянь на знак >=: число, яке дорівнює 10, також підходить. Спробуй ще раз.":"Не зовсім. Зверни увагу на число та умову. Спробуй ще раз.");
  return;
 }
 if(state.level===2){
  if(action==="slot"){
   if(state.passed)return;
   var empty=state.slots.indexOf("");
   if(empty!==-1)state.slots[empty]=value;
   state.notice="";state.hint=false;store();render();
  }else if(action==="clear-slot"){
   if(state.passed)return;
   state.slots[Number(index)]="";state.notice="";store();render();
  }else if(action==="check-slots"){
   if(state.slots[0]==="if"&&state.slots[1]==="else")finishPart();
   else fail("Перший пропуск перевіряє умову: це if. Другий описує інший варіант: це else. Натисни на слово в коді, щоб замінити його.");
  }
  return;
 }
 if(state.level===4){
  if(action==="add-line"){
   if(state.assembled||state.lines.length>=4||state.lines.includes(value))return;
   state.lines.push(value);state.notice="";store();render();
  }else if(action==="undo"){
   if(state.assembled)return;
   state.lines.pop();state.notice="";store();render();
  }else if(action==="clear-lines"){
   if(state.assembled)return;
   state.lines=[];state.notice="";store();render();
  }else if(action==="check-lines"){
   if(state.lines.length!==4)return;
   var got=state.lines.map(function(id){return lineOptions.find(function(x){return x.id===id;}).text;});
   if(got.every(function(line,i){return line===correctLines[i];})){
    state.assembled=true;state.notice="";state.hint=false;store();render();
   }else fail("Тут є помилка в порядку або в умові. Перевір: if → дія з відступом → else → дія з відступом.");
  }else if(action==="run"&&state.assembled){
   var n=Number(value);
   if(n!==0&&n!==1)return;
   if(!state.tests.includes(n))state.tests.push(n);
   state.passed=state.tests.includes(0)&&state.tests.includes(1);
   store();render();
  }
 }
}
document.addEventListener("click",function(event){
 var target=event.target.closest("[data-action]");
 if(!target)return;
 handle(target.getAttribute("data-action"),target.getAttribute("data-value"),target.getAttribute("data-index"));
});
document.getElementById("restart").addEventListener("click",function(){handle("restart");});
render();
})();
</script>
</body>
</html>
